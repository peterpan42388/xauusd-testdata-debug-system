<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XAUUSD 本地K线调试系统</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <header>
    <h1>XAUUSD 本地K线调试系统</h1>
    <div class="toolbar">
      <span id="dataMeta" style="display:none;"></span>
      <div class="engineGroup">
        <button id="openCommonConfigBtn" class="mini">公共配置</button>
        <select id="engineFile" class="mini compactSelect"></select>
      </div>
      <button id="switchEngineBtn" class="mini">切换引擎</button>
      <select id="datasetBucket" class="mini compactSelect narrowSelect">
        <option value="year">年</option>
        <option value="month">月</option>
        <option value="week">周</option>
        <option value="day">日</option>
      </select>
      <select id="datasetFile" class="mini compactSelect narrowSelect"></select>
      <button id="switchDatasetBtn" class="mini">刷新</button>
      <button id="playToggleBtn" class="mini">播放</button>
      <select id="playSpeed" class="mini">
        <option value="1">1秒/根</option>
        <option value="2">2秒/根</option>
        <option value="5">5秒/根</option>
        <option value="10">10秒/根</option>
      </select>
      <input id="playProgress" type="range" min="0" max="0" step="1" value="0" />
      <span id="playTimeLabel" class="playTimeLabel">--</span>
      <button id="modeBarBtn" class="mini active">单K评论</button>
      <button id="modeRangeBtn" class="mini">区间评论</button>
      <button id="submitPendingTop" class="mini primary">提交评论(0)</button>
      <button id="clearCommentsBtn" class="mini">清空评论</button>
      <a href="/api/comments.csv" target="_blank">导出CSV</a>
    </div>
  </header>

  <main>
    <section id="chartPanel">
      <div id="chartViewport">
        <div id="chartWrap">
          <div id="chart"></div>
        </div>
        <div id="centerCrosshair" aria-hidden="true">
          <div class="center-line-v"></div>
          <div class="center-line-h"></div>
          <div class="center-dot"></div>
          <div class="center-tag-x">center_X</div>
          <div class="center-tag-y">center_Y</div>
        </div>
      </div>
      <div id="miniWrap">
        <div id="miniChart"></div>
      </div>
      <div id="hint">提示：单K模式点击K线弹窗评论；区间模式连续点击两根K线后弹窗评论。</div>
    </section>

    <aside id="sidePanel">
      <div class="card">
        <h3>实时播放 / SignalContext</h3>
        <pre id="signalContextInfo">未开始播放</pre>
      </div>

      <div class="card">
        <h3>当前选中</h3>
        <pre id="selectedInfo">未选择</pre>
      </div>

      <div class="card">
        <h3>行为列表（脚本流程）</h3>
        <div class="flowToolbar">
          <button id="flowOpsBtn" class="mini active">仅操作</button>
          <button id="flowAllBtn" class="mini">全部显示</button>
        </div>
        <div id="flowList" class="logList"></div>
      </div>
    </aside>
  </main>

  <section id="statsPanel" class="card">
    <h3>测试统计视图（初始资金 1000）</h3>
    <div id="statsGrid" class="statsGrid"></div>
    <div id="statsHint" class="statsHint"></div>
    <div class="tradeExplorer">
      <div class="pnlCard">
        <h4>交易筛选与统计</h4>
        <div class="filterRow">
          <label>开始日</label>
          <input id="tradeDateFrom" type="date" />
          <label>结束日</label>
          <input id="tradeDateTo" type="date" />
          <button id="applyTradeRangeBtn" class="mini">应用区间</button>
          <button id="resetTradeRangeBtn" class="mini">重置</button>
        </div>
        <div id="tradeSummaryGrid" class="statsGrid"></div>
      </div>

      <div class="tradeSplit">
        <div class="pnlCard">
          <h4>日期列表（按天）</h4>
          <div id="dailyListTable"></div>
        </div>
        <div class="pnlCard">
          <h4 id="tradeListTitle">交易明细</h4>
          <div id="tradeListTable"></div>
        </div>
      </div>
    </div>
  </section>

  <dialog id="commonConfigModal">
    <form method="dialog" id="commonConfigForm">
      <h3>公共配置（回测参数）</h3>
      <pre id="commonConfigPath"></pre>
      <label>每日最大亏损比例（默认0.08=8%）</label>
      <input id="cfgDailyLossPct" type="number" min="0" step="0.001" />
      <label>每笔最大亏损比例（默认0.08=8%）</label>
      <input id="cfgPerTradeLossPct" type="number" min="0" step="0.001" />
      <label>每日连续亏损次数（默认3）</label>
      <input id="cfgDailyConsecLoss" type="number" min="0" step="1" />
      <div class="actions">
        <button type="button" id="commonConfigCancelBtn">取消</button>
        <button type="button" id="commonConfigSaveBtn">保存配置</button>
      </div>
    </form>
  </dialog>

  <dialog id="commentModal">
    <form method="dialog" id="commentForm">
      <h3 id="modalTitle">添加评论</h3>
      <pre id="modalTarget"></pre>
      <label>类型</label>
      <select id="kind">
        <option value="entry">entry 入场</option>
        <option value="exit">exit 出场</option>
        <option value="bug">bug 问题</option>
        <option value="opt">opt 优化点</option>
        <option value="obs">obs 观察</option>
      </select>
      <label>标签（可选）</label>
      <input id="tag" placeholder="如 STRUCT_DOWN / X_GOLD / STOP" />
      <label>评论</label>
      <textarea id="comment" rows="4" placeholder="写下你对这根K线/区间的观察"></textarea>
      <div class="actions">
        <button type="button" id="cancelBtn">取消</button>
        <button type="button" id="saveBtn">保存到待提交</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
